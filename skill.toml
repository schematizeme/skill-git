pt = "O fluxo git da casa: trunk-based com branches curtas, Conventional Commits, commits assinados, PR pequeno, rulesets e CODEOWNERS, nunca reescrever histórico publicado, segredo commitado (rotacionar primeiro), hooks, tags SemVer e GitHub como fonte da verdade, com gate executável."
