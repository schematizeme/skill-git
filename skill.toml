es = "El flujo git de la casa: trunk-based con ramas cortas, Conventional Commits, commits firmados, PR pequeños, rulesets y CODEOWNERS, nunca reescribir historial publicado, secreto commiteado (rotar primero), hooks, tags SemVer y GitHub como fuente de verdad, con gate ejecutable."
